<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="50%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="irisCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D5FEF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5D5FEF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- iOS Squircle Glass Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>
  <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="url(#irisCyanGrad)" stroke-width="4" opacity="0.75"/>

  <!-- Background Ambient Glow Spot -->
  <circle cx="256" cy="240" r="160" fill="#5D5FEF" opacity="0.15" filter="url(#glowEffect)"/>

  <!-- Stethoscope Monogram M Artwork -->
  <g filter="url(#shadowEffect)">
    <!-- Main Stethoscope Loop forming 'M' -->
    <path d="M 140 180 C 140 140, 185 140, 200 170 C 215 200, 230 250, 256 220 C 282 250, 297 200, 312 170 C 327 140, 372 140, 372 180 C 372 230, 340 310, 256 340 C 172 310, 140 230, 140 180 Z"
          fill="none" 
          stroke="url(#irisCyanGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Earpiece Top Bar -->
    <path d="M 175 145 C 210 120, 302 120, 337 145" 
          fill="none" 
          stroke="url(#irisCyanGrad)" 
          stroke-width="20" 
          stroke-linecap="round"/>

    <!-- Earpiece Tips -->
    <circle cx="170" cy="145" r="14" fill="#5D5FEF"/>
    <circle cx="342" cy="145" r="14" fill="#06B6D4"/>

    <!-- Chestpiece / Stethoscope Bell + Medical Cross Spark at Center Bottom -->
    <circle cx="256" cy="330" r="42" fill="#0b1226" stroke="url(#sparkGrad)" stroke-width="14"/>
    
    <!-- Medical Cross Spark Inside Chestpiece -->
    <path d="M 256 308 V 352 M 234 330 H 278" 
          stroke="#ffffff" 
          stroke-width="10" 
          stroke-linecap="round"/>

    <!-- Vital Pulse Sparkle Point -->
    <circle cx="350" cy="235" r="10" fill="#10B981" filter="url(#glowEffect)"/>
    <circle cx="350" cy="235" r="5" fill="#ffffff"/>
  </g>

  <!-- Typography AS MEDIX -->
  <text x="256" y="440" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="4">
    AS MEDIX
  </text>
</svg>