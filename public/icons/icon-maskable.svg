<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Glowing Caduceus / Medical Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Bar -->
    <rect x="226" y="110" width="60" height="292" rx="24" fill="url(#cyanGrad)"/>
    <!-- Horizontal Cross Bar -->
    <rect x="110" y="226" width="292" height="60" rx="24" fill="url(#cyanGrad)"/>
  </g>

  <!-- Dynamic ECG Heartbeat Line intersecting Cross -->
  <path d="M 90 256 L 175 256 L 205 210 L 235 315 L 265 175 L 295 330 L 325 256 L 422 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Sparkle Points -->
  <circle cx="265" cy="175" r="8" fill="#ffffff"/>
  <circle cx="205" cy="210" r="6" fill="#ffffff"/>
  <circle cx="422" cy="256" r="8" fill="#34d399"/>

  <!-- Badge Text AS MEDIX -->
  <text x="256" y="440" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="4">
    AS MEDIX
  </text>
</svg>